# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Scratch Programming'
site_description: 'An interactive intelligent textbook teaching Scratch programming to ages 8-12 through games, stories, and creative projects'
site_author: 'Dan McCreary'
site_url: 'https://dmccreary.github.io/scratch-textbook/'

# Hooks — runs local Python before/after page processing.
# `plugins/social_override.py` injects og:title, og:description, og:image,
# og:type, og:url, and twitter:* meta tags on every page using each page's
# frontmatter `title:` / `description:` / `image:` (falling back to the site-
# wide values and `img/cover.png`). This is the Cairo-free path to social-
# media previews — works without `pip install "mkdocs-material[imaging]"`.
# If the `social` plugin below is ever enabled, the same hook also rewrites
# its auto-generated `/assets/images/social/...` URLs to point at the
# declared cover image. Verify the result with `bk-check-social-cover`.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/dmccreary/scratch-textbook'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Dan McCreary. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - 1. Welcome to Scratch: chapters/01-welcome-to-scratch/index.md
      - 2. Sprites, Stage, and the Coordinate System: chapters/02-sprites-stage-coordinates/index.md
      - 3. Motion Blocks and Block Categories: chapters/03-motion-blocks-categories/index.md
      - 4. Events, Sequences, and First Scripts: chapters/04-events-sequences-first-scripts/index.md
      - 5. Sounds, Extensions, and Sharing Projects: chapters/05-sounds-extensions-sharing/index.md
      - 6. Broadcasting, Conditionals, and Sensing: chapters/06-broadcasting-conditionals-sensing/index.md
      - 7. Variables, Lists, and Data Management: chapters/07-variables-lists-data/index.md
      - 8. Animation, Parallelism, and Debugging: chapters/08-animation-parallelism-debugging/index.md
      - 9. Advanced Control and Operators: chapters/09-advanced-control-operators/index.md
      - 10. Game Mechanics and Win/Lose Conditions: chapters/10-game-mechanics-win-lose/index.md
      - 11. Design Process and Capstone Project: chapters/11-design-process-capstone/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept Enumeration: learning-graph/concept-list.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Glossary Quality Report: learning-graph/glossary-quality-report.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md
      - Mascot Test Page: learning-graph/mascot-test.md
      - Scratchblocks Test Page: learning-graph/scratchblocks-test.md
      - FAQ Quality Report: learning-graph/faq-quality-report.md
      - FAQ Coverage Gaps: learning-graph/faq-coverage-gaps.md

  - MicroSims:
      - List of MicroSims: sims/index.md
      - Block Categories: sims/block-categories/index.md
      - Block Shape Flow: sims/block-shape-flow/index.md
      - Block Shapes: sims/block-shapes/index.md
      - Broadcast Flow: sims/broadcast-flow/index.md
      - Coordinate Reporters in Action: sims/coordinate-reporters/index.md
      - Interactive Coordinate Explorer: sims/coordinate-explorer/index.md
      - Learning Graph Viewer: sims/graph-viewer/index.md
      - Loop Comparison: sims/loop-comparison/index.md
      - Motion Blocks Visual Guide: sims/motion-blocks-guide/index.md
      - Scratch Editor Overview: sims/editor-overview/index.md
      - Script Anatomy: sims/script-anatomy/index.md
      - Stage Coordinate System: sims/stage-coordinates/index.md
      - Stage Layout and Boundaries: sims/stage-layout/index.md
      - Three Tabs Explained: sims/three-tabs/index.md

  - Appendices:
      - Introduction: appendices/index.md
      - List of Scratch Blocks: appendices/list-of-scrach-blocks.md

  - FAQ: faq.md
  - Glossary: glossary.md
  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  logo: img/mascot/welcome.png
  favicon: img/favicon.ico
  palette:
    primary: 'orange'
    accent: 'deep-orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom
      skip_classes:
        - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css
  - css/mascot.css
  - css/scratchblocks.css

# Custom JavaScript.
# Pin the scratchblocks version — @latest will eventually ship a change
# that breaks every diagram in the book at once.
extra_javascript:
  - https://cdn.jsdelivr.net/npm/scratchblocks@3.7.1/build/scratchblocks.min.js
  - js/scratchblocks-init.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Scratch Programming'
  textbook_version: '0.1'

  # Google Analytics — property ID: G-X328R30VNC
  analytics:
    provider: google
    property: G-X328R30VNC
